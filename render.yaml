services:
  - type: web
    name: cee-tender-intelligence
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: {name: cee-tenders-db, property: connectionString}
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
  - type: cron
    name: cee-tender-sync
    runtime: docker
    plan: starter
    schedule: "0 */4 * * *"
    dockerCommand: python scripts/sync_all.py
    envVars:
      - key: DATABASE_URL
        fromDatabase: {name: cee-tenders-db, property: connectionString}
databases:
  - name: cee-tenders-db
    plan: basic-256mb
