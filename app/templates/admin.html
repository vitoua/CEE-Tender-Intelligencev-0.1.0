{% extends 'base.html' %}{% block content %}<h1>Admin</h1><section class='admin'><div><h2>KAM / Users</h2><form method='post' action='/admin/users'><input name='name' placeholder='Name' required><input name='email' type='email' placeholder='Email' required><input name='password' placeholder='Password' required><select name='role'><option>kam</option><option>viewer</option><option>manager</option><option>admin</option></select><input name='countries' placeholder='POL,UKR'><button>Add</button></form>{% for x in users %}<p>#{{x.id}} {{x.name}} · {{x.email}} · {{x.role}} · {{x.countries}}</p>{% endfor %}</div><div><h2>Keywords</h2><form method='post' action='/admin/keywords'><input name='term' placeholder='Keyword' required><select name='category'><option>SSD</option><option>DRAM</option><option>Flash</option><option>NAND</option></select><input name='weight' type='number' value='15'><button>Add</button></form>{% for x in keywords %}<p>{{x.category}} · {{x.term}} · {{x.weight}}</p>{% endfor %}</div></section>{% endblock %}
